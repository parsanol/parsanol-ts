name: Release npm (parsanol)

# Trusted publishing: keyless OIDC. Requires the owner-side registration
# on npmjs.com — package parsanol → Settings → Trusted Publishing:
#   Repository: parsanol/parsanol-ts | Workflow: publish.yml (no environment)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # the OIDC token that replaces the npm token

concurrency:
  group: release-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install
      - run: npm run build
      - name: Publish with provenance
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: "" # explicit: trusted publishing only, no token
