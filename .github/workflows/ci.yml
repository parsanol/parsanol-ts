name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: pubid/pubid-grammar
          path: pubid-grammar
      # The conformance corpus and the wasm freshness reference both
      # track parsanol-rs (corpus/conformance + BUILT_FROM). The
      # freshness gate resolves BUILT_FROM as an ancestor of the rs
      # head, so the checkout needs history — depth 1 cannot even
      # name the commit and the gate would false-fail as diverged.
      - uses: actions/checkout@v7
        with:
          repository: parsanol/parsanol-rs
          path: parsanol-rs
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - name: Wasm freshness
        run: bash scripts/check-wasm-freshness.sh
        env:
          PARSANOL_RS: ${{ github.workspace }}/parsanol-rs
      - name: Build + test (artifact-gated against the baked corpus)
        run: npm test
        env:
          PARG_ARTIFACT_DIR: ${{ github.workspace }}/pubid-grammar/artifacts
          PARG_CONFORMANCE_DIR: ${{ github.workspace }}/parsanol-rs/corpus/conformance
  # plurimath#540 requirement 3: replay each staged testsuite generation
  # with raw-tree rows on the wasm engine and compare it with the
  # Ruby-produced rows. Each stage gem's artifact is pinned to the commit
  # its generation's provenance names for the raw-tree producer.
  stage-replay:
    name: stage-replay (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: latex
            gem: plurimath/latexmath
            ref: 27e300a433742765486e3bead2fac19ee8fd55a0
            artifact: latex.json
            generation: stages/latex/generations/000003
          - language: asciimath
            gem: plurimath/amath
            ref: 8ec8ba05bc49196aa5825782a052f51a2db99c7a
            artifact: asciimath.json
            generation: stages/asciimath/generations/000003
          - language: unicode
            gem: plurimath/umath
            ref: 0302568ef9446b1b099d15a56445ed7624816462
            artifact: umath.json
            generation: stages/unicode/generations/000004
    steps:
      - uses: actions/checkout@v7
      # grammars/ holds umath's wrapper table (umath.wrappers.json).
      - uses: actions/checkout@v7
        with:
          repository: ${{ matrix.gem }}
          ref: ${{ matrix.ref }}
          path: stage-gem
          sparse-checkout: |
            artifacts
            grammars
      - uses: actions/checkout@v7
        with:
          repository: plurimath/plurimath-testsuite
          path: plurimath-testsuite
          sparse-checkout: ${{ matrix.generation }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - name: Replay ${{ matrix.generation }} (raw-tree rows)
        run: >
          npm run replay-stage --
          stage-gem/artifacts/${{ matrix.artifact }}
          plurimath-testsuite/${{ matrix.generation }}/payloads
          --language ${{ matrix.language }}
      - name: Stage replay test (artifact-gated)
        run: node --test dist-test/test/stage-replay.test.js
        env:
          PARG_ARTIFACT_DIR: ${{ github.workspace }}/stage-gem/artifacts
          STAGE_ARTIFACT: ${{ matrix.artifact }}
          STAGE_LANGUAGE: ${{ matrix.language }}
          STAGE_PAYLOADS: ${{ github.workspace }}/plurimath-testsuite/${{ matrix.generation }}/payloads
